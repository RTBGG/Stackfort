name: Release artifacts

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  release_policy:
    name: Resolve and enforce release channel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Resolve strict release metadata
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${REF_NAME#v}"
            test "${REF_NAME}" = "v${version}"
          fi
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          beta='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$'
          if [[ "${version}" =~ ${stable} ]]; then
            channel=stable
          elif [[ "${version}" =~ ${beta} ]]; then
            channel=beta
          else
            printf 'Version must be X.Y.Z or X.Y.Z-beta.N with canonical numeric components.\n' >&2
            exit 1
          fi
          printf 'version=%s\nchannel=%s\n' "${version}" "${channel}" >>"$GITHUB_OUTPUT"
  waf-packages:
    name: WAF package — ${{ matrix.name }}
    needs: release_policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            id: debian-13
            image: debian:13
          - name: Ubuntu 26.04
            id: ubuntu-26.04
            image: ubuntu:26.04
          - name: Rocky Linux 10
            id: rocky-10
            image: rockylinux/rockylinux:10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare exact native build host
        run: |
          bash packaging/waf/prepare-build-host.sh
          useradd --system --user-group --create-home --home-dir /var/tmp/stackfort-build --shell /bin/bash stackfort-build
          install -d -o stackfort-build -g stackfort-build \
            /var/tmp/stackfort-waf-bundle /var/tmp/stackfort-waf-native
      - name: Build hash-pinned native WAF package
        run: |
          runuser --user stackfort-build -- env \
            SOURCE_DATE_EPOCH=0 \
            bash "$GITHUB_WORKSPACE/packaging/waf/build-bundle.sh" /var/tmp/stackfort-waf-bundle
          runuser --user stackfort-build -- env \
            SOURCE_DATE_EPOCH=0 \
            bash "$GITHUB_WORKSPACE/packaging/waf/build-native-package.sh" \
            /var/tmp/stackfort-waf-bundle/*.tar.gz /var/tmp/stackfort-waf-native
      - name: Upload native WAF package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stackfort-waf-${{ matrix.id }}
          path: /var/tmp/stackfort-waf-native/*
          if-no-files-found: error
          retention-days: 7

  vinyl-packages:
    name: Vinyl package — ${{ matrix.name }}
    needs: release_policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            id: debian-13
            image: debian:13
          - name: Ubuntu 26.04
            id: ubuntu-26.04
            image: ubuntu:26.04
          - name: Rocky Linux 10
            id: rocky-10
            image: rockylinux/rockylinux:10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare exact native build host
        run: |
          bash packaging/vinyl/prepare-build-host.sh
          useradd --system --user-group --create-home --home-dir /var/tmp/stackfort-build --shell /bin/bash stackfort-build
          install -d -o stackfort-build -g stackfort-build /var/tmp/stackfort-vinyl-native
      - name: Build hash-pinned native Vinyl package
        run: |
          runuser --user stackfort-build -- env \
            SOURCE_DATE_EPOCH=0 \
            bash "$GITHUB_WORKSPACE/packaging/vinyl/build-native-package.sh" \
            /var/tmp/stackfort-vinyl-native
      - name: Upload native Vinyl package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stackfort-vinyl-${{ matrix.id }}
          path: /var/tmp/stackfort-vinyl-native/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build, inventory, and attest
    needs: [release_policy, waf-packages, vinyl-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install native package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm
      - name: Download native WAF packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stackfort-waf-*
          path: waf-native
          merge-multiple: true
      - name: Download native Vinyl packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stackfort-vinyl-*
          path: vinyl-native
          merge-multiple: true
      - name: Build deterministic archives
        env:
          COMMIT: ${{ github.sha }}
          STACKFORT_WAF_PACKAGE_DIR: ${{ github.workspace }}/waf-native
          STACKFORT_VINYL_PACKAGE_DIR: ${{ github.workspace }}/vinyl-native
          VERSION: ${{ needs.release_policy.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$COMMIT")"
          export SOURCE_DATE_EPOCH
          bash scripts/build-release.sh
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/stackfort-${{ needs.release_policy.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish immutable GitHub release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ needs.release_policy.outputs.channel }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists; refusing to replace immutable assets.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          release_flags=(--verify-tag --generate-notes --title "Stackfort $RELEASE_TAG")
          if [[ "$RELEASE_CHANNEL" == beta ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" dist/* "${release_flags[@]}"
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,isImmutable)"
          if ! jq -e --arg tag "$RELEASE_TAG" --arg channel "$RELEASE_CHANNEL" '
            .tagName == $tag and .isDraft == false and .isImmutable == true and
            (($channel == "beta" and .isPrerelease == true) or
             ($channel == "stable" and .isPrerelease == false))
          ' <<<"$release_json" >/dev/null; then
            if [[ "$(jq -r '.isImmutable' <<<"$release_json")" == false ]]; then
              gh release delete "$RELEASE_TAG" --yes
            fi
            printf 'Published release did not satisfy the immutable channel policy. Enable release immutability and retry.\n' >&2
            exit 1
          fi
          gh release verify "$RELEASE_TAG" >/dev/null
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stackfort-${{ needs.release_policy.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
